name: CI Pipeline

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.txt', 'constraints.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        pip install -e .
    
    - name: Run tests with coverage
      run: |
        pytest tests/ -v --cov=weldscope --cov-report=xml --cov-report=term-missing --cov-fail-under=90
    
    - name: Enforce error lint and type checking
      run: |
        pylint weldscope/ --errors-only
        mypy weldscope/ --ignore-missing-imports

    - name: Run corpus retrieval regression gate
      run: |
        python scripts/benchmark_retrieval.py --gate benchmarks/fsw-v1/thresholds.json --output artifacts/retrieval

    - name: Preserve benchmark and operational evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: quality-evidence-python-${{ matrix.python-version }}
        path: |
          artifacts/retrieval/
          artifacts/telemetry/
          coverage.xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}

  lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    
    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install -c constraints.txt black pylint mypy
    
    - name: Check code formatting with black
      run: |
        black --check weldscope/ tests/
    

  security:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    
    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install -c constraints.txt bandit
    
    - name: Run bandit security scan
      run: |
        bandit -r weldscope/ -ll
