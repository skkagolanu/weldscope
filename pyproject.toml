[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "weldscope"
version = "1.0.0"
description = "WeldScope - a research assistant for friction stir welding defects"
authors = [{name = "Sai Karthik Kagolanu", email = "skullkrak7@example.com"}]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "streamlit==1.67.0",
    "pandas==3.1.1",
    "langchain-core==1.7.7",
    "langchain-chroma==1.1.0",
    "langchain-text-splitters==1.1.3",
    "groq==1.7.0",
    "sentence-transformers==6.3.0",
    "transformers==5.22.2",
    "torch==2.15.0",
    "huggingface-hub==2.4.0",
    "bm25s==0.3.16",
    "chromadb==1.5.9",
    "pypdf==7.0.1",
    "langfuse==5.2.0",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
    "python-dotenv==1.2.4",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "black==26.10.1",
    "pylint==4.1.3",
    "mypy==2.4.1",
    "bandit==1.9.4",
    "pip-audit==2.10.1",
    "playwright==1.65.0",
]

docs = [
    "sphinx==9.1.1",
    "sphinx-rtd-theme==3.1.0",
    "myst-parser==5.2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["weldscope*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov=weldscope",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
]

[tool.coverage.run]
source = ["weldscope"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/venv/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  \.git
  | \.venv
  | venv
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [
    "venv",
    "build",
    "dist",
]

[tool.pylint.messages_control]
disable = [
    "C0114",  # missing-module-docstring
    "C0115",  # missing-class-docstring
    "C0116",  # missing-function-docstring
    "R0913",  # too-many-arguments
    "R0914",  # too-many-locals
    "W0212",  # protected-access
]

[tool.pylint.format]
max-line-length = 120

[tool.bandit]
exclude_dirs = ["tests", "venv"]
skips = ["B101"]  # assert_used
